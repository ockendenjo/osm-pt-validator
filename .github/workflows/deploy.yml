name: deploy

on:
  workflow_call:
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_REGION:
        required: true
      TF_STATE_BUCKET:
        required: true
      TF_STATE_OBJECT_KEY:
        required: true
      BINARY_BUCKET:
        required: true
      PERMISSIONS_BOUNDARY_ARN:
        required: true
      DATA_BUCKET:
        required: true

permissions: {}

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pro
    permissions:
      id-token: write  # Required for OIDC authentication with AWS
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        timeout-minutes: 1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Pull terraform config
        working-directory: stack
        shell: bash
        run: |
          mkdir -p tfvars
          aws s3 cp "s3://${INPUTS_BUCKET}/pro.auto.tfvars" tfvars/
          aws s3 cp "s3://${INPUTS_BUCKET}/pro.backend.tfvars" tfvars/
        env:
          INPUTS_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

      - name: Init
        working-directory: stack
        run: |
          terraform init -backend-config=tfvars/pro.backend.tfvars

      - name: Deploy stack
        working-directory: stack
        shell: bash
        run: |
          terraform apply -auto-approve -var-file="tfvars/pro.auto.tfvars" -input=false

      - name: Sync routes
        run: aws s3 sync routes/ s3://$DATA_BUCKET/routes --delete
        env:
          DATA_BUCKET: ${{ secrets.DATA_BUCKET }}

      - name: Sync searches
        run: aws s3 sync search/ s3://$DATA_BUCKET/search --delete
        env:
          DATA_BUCKET: ${{ secrets.DATA_BUCKET }}
