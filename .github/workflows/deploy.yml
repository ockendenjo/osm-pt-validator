name: deploy

on:
  workflow_call:
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_REGION:
        required: true
      TF_STATE_BUCKET:
        required: true
      TF_STATE_OBJECT_KEY:
        required: true
      BINARY_BUCKET:
        required: true
      PERMISSIONS_BOUNDARY_ARN:
        required: true
      DATA_BUCKET:
        required: true

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pro
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        timeout-minutes: 1
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Pull terraform config
        working-directory: stack
        shell: bash
        run: |
          mkdir -p tfvars
          aws s3 cp "s3://${INPUTS_BUCKET}/pro.auto.tfvars" tfvars/
          aws s3 cp "s3://${INPUTS_BUCKET}/pro.backend.tfvars" tfvars/
        env:
          INPUTS_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

      - name: Init
        working-directory: stack
        run: |
          terraform init -backend-config=tfvars/pro.backend.tfvars

      - name: Deploy stack
        working-directory: stack
        shell: bash
        run: |
          terraform apply -auto-approve -var-file="tfvars/pro.auto.tfvars" -input=false

      - name: Sync routes
        run: aws s3 sync routes/ s3://${{ secrets.DATA_BUCKET }}/routes --delete

      - name: Sync searches
        run: aws s3 sync search/ s3://${{ secrets.DATA_BUCKET }}/search --delete
